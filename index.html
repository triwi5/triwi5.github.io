document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

yle=\"display:inline-block;width:20px;height:20px;flex:0 0 20px;background:var(--pink);-webkit-mask:url(&quot;a5d9db56-7001-4fa9-bf95-1cfcc1447eab&quot;) center/contain no-repeat;mask:url(&quot;a5d9db56-7001-4fa9-bf95-1cfcc1447eab&quot;) center/contain no-repeat;margin-top:2px\"><\u002Fspan><div><div style=\"font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px\">Duration<\u002Fdiv><div style=\"font-size:17px;font-weight:600;line-height:1.35\">8 weeks<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n      <div data-chips=\"\" style=\"position:sticky;top:calc({{ barH }}px + 14px);z-index:1;margin:28px 0 0;padding:0;pointer-events:none;display:flex;flex-wrap:wrap;gap:12px;background:{{ chipsBg }};box-shadow:{{ chipsShadow }};transition:background .2s, box-shadow .2s\">\n        <button sc-camel-on-click=\"{{ jump_omg_problem }}\" style=\"pointer-events:auto;font:inherit;font-size:16px;font-weight:700;color:var(--ink);border:0;cursor:pointer;padding:11px 18px;border-radius:12px;background:{{ cb_omg_problem }};box-shadow:0 4px 0 color-mix(in oklch, var(--pink) 55%, black);transition:transform .12s, box-shadow .12s\" style-hover=\"transform:translateY(-2px)\" style-active=\"transform:translateY(3px);box-shadow:0 1px 0 color-mix(in oklch, var(--pink) 55%, black)\"><span style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:9px;height:9px;flex:0 0 9px;border-radius:2px;background:var(--pink);transform:rotate(45deg)\"><\u002Fspan>The Problem<\u002Fspan><\u002Fbutton>\n        <button sc-camel-on-click=\"{{ jump_omg_iteration }}\" style=\"pointer-events:auto;font:inherit;font-size:16px;font-weight:700;color:var(--ink);border:0;cursor:pointer;padding:11px 18px;border-radius:12px;background:{{ cb_omg_iteration }};box-shadow:0 4px 0 color-mix(in oklch, var(--pink) 55%, black);transition:transform .12s, box-shadow .12s\" style-hover=\"transform:translateY(-2px)\" style-active=\"transform:translateY(3px);box-shadow:0 1px 0 color-mix(in oklch, var(--pink) 55%, black)\"><span style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:9px;height:9px;flex:0 0 9px;border-radius:2px;background:var(--pink);transform:rotate(45deg)\"><\u002Fspan>Iteration<\u002Fspan><\u002Fbutton>\n        <button sc-camel-on-click=\"{{ jump_omg_result }}\" style=\"pointer-events:auto;font:inherit;font-size:16px;font-weight:700;color:var(--ink);border:0;cursor:pointer;padding:11px 18px;border-radius:12px;background:{{ cb_omg_result }};box-shadow:0 4px 0 color-mix(in oklch, var(--pink) 55%, black);transition:transform .12s, box-shadow .12s\" style-hover=\"transform:translateY(-2px)\" style-active=\"transform:translateY(3px);box-shadow:0 1px 0 color-mix(in oklch, var(--pink) 55%, black)\"><span style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:9px;height:9px;flex:0 0 9px;border-radius:2px;background:var(--pink);transform:rotate(45deg)\"><\u002Fspan>The Result<\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"margin-top:20px\"><div style=\"aspect-ratio:16/9;position:relative;transform:rotate(-0.6deg)\"><div style=\"position:absolute;inset:0;border:10px solid var(--gold);border-radius:26px;background:var(--gold);box-shadow:0 1px 1px oklch(0.2 0.03 50 / 0.15), 0 10px 22px -10px oklch(0.2 0.03 50 / 0.45);overflow:hidden\"><iframe src=\"https://www.youtube-nocookie.com/embed/KDDg2lKuXxw?rel=0\" title=\"Oh! Meow God. trailer\" loading=\"lazy\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" referrerpolicy=\"strict-origin-when-cross-origin\" allowfullscreen=\"\" style=\"display:block;width:100%;height:100%;border:0;border-radius:16px;background:#000\"><\u002Fiframe><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:clamp(56px,7vw,88px);margin-top:clamp(56px,7vw,88px)\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:16px 48px\">\n        <div style=\"flex:0 0 180px;padding-top:4px\"><div style=\"display:flex;align-items:center;gap:12px;font-size:22px;font-weight:800;letter-spacing:-0.02em\"><span style=\"width:11px;height:11px;flex:0 0 11px;border-radius:3px;background:var(--pink);transform:rotate(45deg)\"><\u002Fspan>Overview<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1 1 420px;min-width:0\">\n          <p style=\"margin:0;font-family:'Young Serif',Georgia,serif;font-size:clamp(21px,2.1vw,28px);line-height:1.4;max-width:32ch;text-wrap:pretty\">Oh! Meow God. is a stylized 3D puzzle platformer where you play a shapeshifting goober escorting a helpless god through a level.<\u002Fp>\n          <p style=\"margin:18px 0 0;font-size:18px;line-height:1.6;color:var(--muted);max-width:58ch;text-wrap:pretty\">A team of 17 built it on a student-made custom engine. I was design lead and the sole designer for the 3Cs and abilities. This case study focuses on the camera.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"ov-omg-problem\" style=\"display:flex;flex-wrap:wrap;gap:16px 48px;scroll-margin-top:100px\">\n        <div style=\"flex:0 0 180px;padding-top:4px\"><div style=\"display:flex;align-items:center;gap:12px;font-size:22px;font-weight:800;letter-spacing:-0.02em\"><span style=\"width:11px;height:11px;flex:0 0 11px;border-radius:3px;background:var(--pink);transform:rotate(45deg)\"><\u002Fspan>The Problem<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1 1 420px;min-width:0\">\n          <h3 style=\"margin:0;font-size:clamp(24px,2.6vw,34px);font-weight:800;line-height:1.12;letter-spacing:-0.025em;max-width:30ch;text-wrap:balance\">The engine’s camera couldn’t even follow the player.<\u002Fh3>\n          <p style=\"margin:14px 0 0;font-size:18px;line-height:1.6;color:var(--muted);max-width:58ch;text-wrap:pretty\">Up close, the camera had to make jumps readable. Zoomed out, it had to show an overview of the god's path as well as the puzzle. The engine’s camera only snapped between fixed trigger boxes, with no follow and no player input. Hand-placed camera zones for every beat were out of scope for our three designers. And I couldn’t code any of it myself: every behavior went through Michiel, our gameplay programmer, on an engine that crashed regularly.<\u002Fp>\n          <div style=\"margin-top:28px\"><div style=\"aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:var(--panel-2)\"><video data-seg=\"12.5,19.6\" data-src=\"assets/omg-original-camera.mp4\" muted=\"\" playsinline=\"\" aria-label=\"The engine’s original camera\" style=\"display:block;width:100%;height:100%;object-fit:cover;background:#000\"><\u002Fvideo><\u002Fdiv>\n          <div style=\"margin-top:10px;font-size:14px;font-weight:600;color:var(--muted)\">The engine’s original camera: fixed angles.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"ov-omg-iteration\" style=\"display:flex;flex-wrap:wrap;gap:16px 48px;scroll-margin-top:100px\">\n        <div style=\"flex:0 0 180px;padding-top:4px\"><div style=\"display:flex;align-items:center;gap:12px;font-size:22px;font-weight:800;letter-spacing:-0.02em\"><span style=\"width:11px;height:11px;flex:0 0 11px;border-radius:3px;background:var(--pink);transform:rotate(45deg)\"><\u002Fspan>Iteration<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1 1 420px;min-width:0\">\n          <h3 style=\"margin:0;font-size:clamp(24px,2.6vw,34px);font-weight:800;line-height:1.12;letter-spacing:-0.025em;max-width:30ch;text-wrap:balance\">From a trigger box to a camera built for exactly one game.<\u002Fh3>\n          <p style=\"margin:14px 0 0;font-size:18px;line-height:1.6;color:var(--muted);max-width:58ch;text-wrap:pretty\">Since I couldn’t prototype by building, I designed through specs and tuning. Michiel implemented, I tuned the exposed values, and together we decided what was missing next.<\u002Fp>\n          <div style=\"margin-top:32px;display:flex;flex-direction:column;gap:36px\">\n            <div style=\"display:flex;flex-wrap:wrap;gap:20px 28px;align-items:flex-start\">\n              <div style=\"flex:0 0 clamp(180px,22vw,260px)\"><div style=\"aspect-ratio:4/3;position:relative;transform:rotate(-2deg)\"><div style=\"position:absolute;inset:0;border:6px solid var(--gold);border-radius:16px;background:var(--gold);box-shadow:0 1px 1px oklch(0.2 0.03 50 / 0.15), 0 10px 22px -10px oklch(0.2 0.03 50 / 0.45);overflow:hidden\"><button sc-camel-on-click=\"{{ openSpec }}\" aria-label=\"Open full camera spec\" style=\"border:0;padding:0;margin:0;cursor:zoom-in;font:inherit;position:relative;display:block;width:100%;height:100%;border-radius:10px;overflow:hidden;background:#fff\"><img src=\"b289bc3c-4a8b-40e1-a91f-a813c586f85e\" alt=\"Camera feature spec in Miro: base free camera, camera zones, exposed variables and zoom setup\" style=\"display:block;width:100%;height:100%;object-fit:cover;object-position:top\"><span style=\"position:absolute;right:8px;bottom:8px;padding:4px 9px;border-radius:8px;background:oklch(0.2 0.02 260 / 0.85);color:#fff;font-size:12px;font-weight:700\">View full spec<\u002Fspan><\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n              <div style=\"flex:1 1 280px;min-width:0\">\n                <div style=\"display:flex;align-items:baseline;gap:12px;flex-wrap:wrap\"><span style=\"font-size:14px;font-weight:800;color:var(--on-accent);background:var(--pink);padding:3px 9px;border-radius:8px\">v1<\u002Fspan><span style=\"font-size:20px;font-weight:800;letter-spacing:-0.015em\">A free camera on paper.<\u002Fspan><\u002Fdiv>\n                <p style=\"margin:10px 0 0;font-size:17px;line-height:1.6;color:var(--muted);max-width:56ch;text-wrap:pretty\">I wrote a feature spec for a Mario Sunshine-style free camera, with a paintover to lock the perspective, reference GIFs, a rig sketch, and a list of variables I needed exposed. The first orbit prototype came together quickly. But the sprint 2 review flagged the camera as behind: a camera that only follows and rotates exposes every problem the level throws at it.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;flex-direction:row-reverse;justify-content:flex-end;gap:20px 28px;align-items:flex-start\">\n              <div style=\"flex:0 0 clamp(180px,22vw,260px)\"><div style=\"aspect-ratio:4/3;position:relative;transform:rotate(1.5deg)\"><div style=\"position:absolute;inset:0;border:6px solid var(--gold);border-radius:16px;background:var(--gold);box-shadow:0 1px 1px oklch(0.2 0.03 50 / 0.15), 0 10px 22px -10px oklch(0.2 0.03 50 / 0.45);overflow:hidden\"><image-slot id=\"cs-omg-v2\" shape=\"rounded\" radius=\"10\" placeholder=\"Boom collision or follow clip\" style=\"display:block;width:100%;height:100%\"><\u002Fimage-slot><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n              <div style=\"flex:1 1 280px;min-width:0\">\n                <div style=\"display:flex;align-items:baseline;gap:12px;flex-wrap:wrap\"><span style=\"font-size:14px;font-weight:800;color:var(--on-accent);background:var(--pink);padding:3px 9px;border-radius:8px\">v2<\u002Fspan><span style=\"font-size:20px;font-weight:800;letter-spacing:-0.015em\">A camera that works without being touched.<\u002Fspan><\u002Fdiv>\n                <p style=\"margin:10px 0 0;font-size:17px;line-height:1.6;color:var(--muted);max-width:56ch;text-wrap:pretty\">Boom collision and near-plane fading stopped it clipping into walls and losing the cat. Players’ hands were busy with jumps and abilities, so follow delay, auto rotation, and a reset button let the camera do most of the work. When I had the jump rebuilt with variable height, I added dynamic vertical following, so the camera stays calm mid-jump and catches up on landing.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:20px 28px;align-items:flex-start\">\n              <div style=\"flex:0 0 clamp(180px,22vw,260px)\"><div style=\"aspect-ratio:4/3;position:relative;transform:rotate(-1deg)\"><div style=\"position:absolute;inset:0;border:6px solid var(--gold);border-radius:16px;background:var(--gold);box-shadow:0 1px 1px oklch(0.2 0.03 50 / 0.15), 0 10px 22px -10px oklch(0.2 0.03 50 / 0.45);overflow:hidden\"><image-slot id=\"cs-omg-v3\" shape=\"rounded\" radius=\"10\" placeholder=\"Zoomed in vs. zoomed out\" style=\"display:block;width:100%;height:100%\"><\u002Fimage-slot><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n              <div style=\"flex:1 1 280px;min-width:0\">\n                <div style=\"display:flex;align-items:baseline;gap:12px;flex-wrap:wrap\"><span style=\"font-size:14px;font-weight:800;color:var(--on-accent);background:var(--pink);padding:3px 9px;border-radius:8px\">v3<\u002Fspan><span style=\"font-size:20px;font-weight:800;letter-spacing:-0.015em\">The overview, which shipped.<\u002Fspan><\u002Fdiv>\n                <p style=\"margin:10px 0 0;font-size:17px;line-height:1.6;color:var(--muted);max-width:56ch;text-wrap:pretty\">Zoom drives pitch, height, and distance together. Pull out for a readable top-down view of the god’s path, push in for precise platforming. I added an invert setting and tuned everything against my metrics gym.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"ov-omg-result\" style=\"display:flex;flex-wrap:wrap;gap:16px 48px;scroll-margin-top:100px\">\n        <div style=\"flex:0 0 180px;padding-top:4px\"><div style=\"display:flex;align-items:center;gap:12px;font-size:22px;font-weight:800;letter-spacing:-0.02em\"><span style=\"width:11px;height:11px;flex:0 0 11px;border-radius:3px;background:var(--pink);transform:rotate(45deg)\"><\u002Fspan>The Result<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1 1 420px;min-width:0\">\n          <h3 style=\"margin:0;font-size:clamp(24px,2.6vw,34px);font-weight:800;line-height:1.12;letter-spacing:-0.025em;max-width:30ch;text-wrap:balance\">A camera tailored to one game, shipped across six public releases.<\u002Fh3>\n          <p style=\"margin:14px 0 0;font-size:18px;line-height:1.6;color:var(--muted);max-width:58ch;text-wrap:pretty\">The camera grew from a trigger box into nine cooperating systems, all built from my specs and tuned by me. It shipped in our <a href=\"https://buas.itch.io/oh-meow-god\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--ink);text-decoration:underline;text-decoration-color:var(--pink);text-underline-offset:4px\">itch.io early access build<\u002Fa>, which saw six updates, over 1,000 views, and over 150 downloads. Every part of it exists because this game needed it.<\u002Fp>\n          <a href=\"https://buas.itch.io/oh-meow-god\" target=\"_blank\" rel=\"noopener\" style=\"margin-top:20px;display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-size:16px;font-weight:700;color:oklch(0.22 0.03 50);background:var(--pink);padding:11px 18px;border-radius:12px;box-shadow:0 4px 0 color-mix(in oklch, var(--pink) 60%, black);transition:transform .12s, box-shadow .12s\" style-hover=\"transform:translateY(-2px)\" style-active=\"transform:translateY(3px);box-shadow:0 1px 0 color-mix(in oklch, var(--pink) 60%, black)\"><img src=\"053429c4-7985-4ddf-bede-a4e114776d1d\" alt=\"\" style=\"width:18px;height:18px;display:block\">Play on itch.io<\u002Fa>\n          <div style=\"margin-top:28px\"><div style=\"aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:var(--panel-2)\"><video data-seg=\"0,29.2\" data-src=\"assets/omg-final-camera.mp4\" muted=\"\" playsinline=\"\" aria-label=\"The final shipped camera\" style=\"display:block;width:100%;height:100%;object-fit:cover;background:#000\"><\u002Fvideo><\u002Fdiv>\n          <div style=\"margin-top:10px;font-size:14px;font-weight:600;color:var(--muted)\">The shipped camera: follow, collision, auto rotation and zoom-driven overview.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-radius:24px;background:var(--pink);color:var(--on-accent);box-shadow:0 6px 0 color-mix(in oklch, var(--pink) 60%, black);padding:clamp(28px,4vw,48px)\">\n        <h3 style=\"margin:0;font-size:clamp(34px,4.4vw,58px);font-weight:900;line-height:0.95;letter-spacing:-0.035em\">What I learned<\u002Fh3>\n        <div style=\"margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px\">\n          <div style=\"padding:20px;border-radius:16px;background:oklch(0.99 0.01 85 / 0.5);box-shadow:0 4px 0 color-mix(in oklch, var(--pink) 65%, black)\"><p style=\"margin:0;font-family:'Young Serif',Georgia,serif;font-size:20px;line-height:1.3\">Tune before you add.<\u002Fp><p style=\"margin:10px 0 0;font-size:16px;line-height:1.55;font-weight:500\">Polishing each system as it arrived showed me what was missing more reliably than designing everything up front.<\u002Fp><\u002Fdiv>\n          <div style=\"padding:20px;border-radius:16px;background:oklch(0.99 0.01 85 / 0.5);box-shadow:0 4px 0 color-mix(in oklch, var(--pink) 65%, black)\"><p style=\"margin:0;font-family:'Young Serif',Georgia,serif;font-size:20px;line-height:1.3\">On a big team, your spec is your hands.<\u002Fp><p style=\"margin:10px 0 0;font-size:16px;line-height:1.55;font-weight:500\">Separating intent, behavior, and exposed variables let Michiel and me work in parallel. However, later changes were agreed verbally and never documented, so the spec drifted out of date.<\u002Fp><\u002Fdiv>\n          <div style=\"padding:20px;border-radius:16px;background:oklch(0.99 0.01 85 / 0.5);box-shadow:0 4px 0 color-mix(in oklch, var(--pink) 65%, black)\"><p style=\"margin:0;font-family:'Young Serif',Georgia,serif;font-size:20px;line-height:1.3\">Test against real level beats earlier.<\u002Fp><p style=\"margin:10px 0 0;font-size:16px;line-height:1.55;font-weight:500\">The camera spent more time in the metrics gym than in the actual level. Next time, I’d get a greybox beat in front of it from the first prototype.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n        <div style=\"margin-top:clamp(56px,7vw,80px);display:flex;flex-wrap:wrap;gap:16px;align-items:stretch\">\n          <button sc-camel-on-click=\"{{ closeCase }}\" style=\"flex:0 0 auto;display:flex;align-items:center;gap:10px;font:inherit;font-size:16px;font-weight:700;color:var(--ink);border:0;cursor:pointer;padding:0 22px;min-height:56px;border-radius:16px;background:var(--panel);box-shadow:0 4px 0 var(--edge)\" style-active=\"transform:translateY(3px);box-shadow:0 1px 0 var(--edge)\"><span aria-hidden=\"true\" style=\"display:inline-block;width:18px;height:18px;flex:0 0 18px;background:var(--ink);-webkit-mask:url(&quot;55002337-c6a2-4b68-b88c-90ca66fdfc8b&quot;) center/contain no-repeat;mask:url(&quot;55002337-c6a2-4b68-b88c-90ca66fdfc8b&quot;) center/contain no-repeat;\"><\u002Fspan>All work<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ show1 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;flex-direction:column;gap:28px\">\n      <div>\n        <span style=\"display:inline-flex;align-items:center;gap:10px;padding:8px 14px;border-radius:12px;background:var(--panel);box-shadow:0 3px 0 var(--edge);font-size:14px;font-weight:700;color:var(--muted)\"><span style=\"width:10px;height:10px;flex:0 0 10px;border-radius:3px;background:var(--blue);transform:rotate(45deg)\"><\u002Fspan>Case study<\u002Fspan>\n        <h2 style=\"margin:20px 0 0 -0.04em;font-size:clamp(48px,8vw,120px);font-weight:900;line-height:0.94;letter-spacing:-0.04em;text-wrap:balance\">Custom Tech/Skill Tree Editor<\u002Fh2>\n        <p style=\"margin:20px 0 0;font-family:'Young Serif',Georgia,serif;font-size:clamp(19px,1.9vw,25px);line-height:1.4;color:var(--muted);max-width:36ch;text-wrap:pretty\">A custom editor that allows developers to quickly build tech or skill trees in Unreal Engine 5.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px\">\n      <div style=\"display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:16px;background:var(--panel);box-shadow:0 4px 0 var(--edge)\"><span aria-hidden=\"true\" style=\"display:inline-block;width:20px;height:20px;flex:0 0 20px;background:var(--blue);-webkit-mask:url(&quot;679683ee-415b-4eee-aa5d-ac7c1f944cb5&quot;) center/contain no-repeat;mask:url(&quot;679683ee-415b-4eee-aa5d-ac7c1f944cb5&quot;) center/contain no-repeat;margin-top:2px\"><\u002Fspan><div><div style=\"font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px\">Role<\u002Fdiv><div style=\"font-size:17px;font-weight:600;line-height:1.35\">Systems designer<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:16px;background:var(--panel);box-shadow:0 4px 0 var(--edge)\"><span aria-hidden=\"true\" style=\"display:inline-block;width:20px;height:20px;flex:0 0 20px;background:var(--blue);-webkit-mask:url(&quot;084d211e-fb8c-486b-8939-e365bd0a2836&quot;) center/contain no-repeat;mask:url(&quot;084d211e-fb8c-486b-8939-e365bd0a2836&quot;) center/contain no-repeat;margin-top:2px\"><\u002Fspan><div><div style=\"font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px\">Team<\u002Fdiv><div style=\"font-size:17px;font-weight:600;line-height:1.35\">Solo project<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:16px;background:var(--panel);box-shadow:0 4px 0 var(--edge)\"><span aria-hidden=\"true\" style=\"display:inline-block;width:20px;height:20px;flex:0 0 20px;background:var(--blue);-webkit-mask:url(&quot;1daba346-52f5-49ff-a15d-8f2af4fc6b4e&quot;) center/contain no-repeat;mask:url(&quot;1daba346-52f5-49ff-a15d-8f2af4fc6b4e&quot;) center/contain no-repeat;margin-top:2px\"><\u002Fspan><div><div style=\"font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px\">Engine<\u002Fdiv><div style=\"font-size:17px;font-weight:600;line-height:1.35\">Unreal Engine 5<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:16px;background:var(--panel);box-shadow:0 4px 0 var(--edge)\"><span aria-hidden=\"true\" style=\"display:inline-block;width:20px;height:20px;flex:0 0 20px;background:var(--blue);-webkit-mask:url(&quot;a5d9db56-7001-4fa9-bf95-1cfcc1447eab&quot;) center/contain no-repeat;mask:url(&quot;a5d9db56-7001-4fa9-bf95-1cfcc1447eab&quot;) center/contain no-repeat;margin-top:2px\"><\u002Fspan><div><div style=\"font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px\">Duration<\u002Fdiv><div style=\"font-size:17px;font-weight:600;line-height:1.35\">8 weeks<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n      <div data-chips=\"\" style=\"position:sticky;top:calc({{ barH }}px + 14px);z-index:1;margin:28px 0 0;padding:0;pointer-events:none;display:flex;flex-wrap:wrap;gap:12px;background:{{ chipsBg }};box-shadow:{{ chipsShadow }};transition:background .2s, box-shadow .2s\">\n        <button sc-camel-on-click=\"{{ jump_tree_problem }}\" style=\"pointer-events:auto;font:inherit;font-size:16px;font-weight:700;color:var(--ink);border:0;cursor:pointer;padding:11px 18px;border-radius:12px;background:{{ cb_tree_problem }};box-shadow:0 4px 0 color-mix(in oklch, var(--blue) 55%, black);transition:transform .12s, box-shadow .12s\" style-hover=\"transform:translateY(-2px)\" style-active=\"transform:translateY(3px);box-shadow:0 1px 0 color-mix(in oklch, var(--blue) 55%, black)\"><span style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:9px;height:9px;flex:0 0 9px;border-radius:2px;background:var(--blue);transform:rotate(45deg)\"><\u002Fspan>The Problem<\u002Fspan><\u002Fbutton>\n        <button sc-camel-on-click=\"{{ jump_tree_iteration }}\" style=\"pointer-events:auto;font:inherit;font-size:16px;font-weight:700;color: " style=\"display:inline-block;width:24px;height:24px;flex:0 0 24px;background:oklch(0.22 0.03 50);-webkit-mask:url(&quot;4cec2655-5f8a-443b-ad3d-709a1340ac5b&quot;) center/contain no-repeat;mask:url(&quot;4cec2655-5f8a-443b-ad3d-709a1340ac5b&quot;) center/contain no-repeat;\"><\u002Fspan><\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;'auto'|'light'|'dark'&quot;},&quot;palette&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Cocoa&quot;,&quot;Midnight&quot;,&quot;Plum&quot;,&quot;Evergreen&quot;,&quot;Charcoal&quot;],&quot;default&quot;:&quot;Midnight&quot;,&quot;tsType&quot;:&quot;'Cocoa'|'Midnight'|'Plum'|'Evergreen'|'Charcoal'&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Gold&quot;,&quot;Ice&quot;,&quot;Mint&quot;,&quot;Coral&quot;,&quot;Lilac&quot;,&quot;Silver&quot;],&quot;default&quot;:&quot;Silver&quot;,&quot;tsType&quot;:&quot;'Gold'|'Ice'|'Mint'|'Coral'|'Lilac'|'Silver'&quot;}}\">\nclass Component extends DCLogic {\n  state = { hover: -1, y: 0, open: false, shown: 0 };\n  keys = [\"omg\",\"tree\",\"bedlam\",\"drat\"];\n  titles = [\"Oh! Meow God.\",\"Custom Tech/Skill Tree Editor\",\"Bedlam\",\"Drat!\"];\n  projects = [\n    { c: 'var(--pink)', tilt: -3, hoverTilt: 1.5 },\n    { c: 'var(--blue)', tilt: 2.5, hoverTilt: -1.5 },\n    { c: 'var(--red)', tilt: -2, hoverTilt: 2 },\n    { c: 'var(--yellow)', tilt: 3, hoverTilt: -1 },\n  ];\n  sheetRef = React.createRef();\n  ready = [0];\n  videos = [null, 'mD34IZ0JFkw', 'Dq8DphNybr4', 'UxZpml4qinw'];\n  barRef = React.createRef();\n  componentDidMount() {\n    this.onMouse = e => { this.mx = e.clientX; this.my = e.clientY; };\n    this.onScroll = () => { this.setState({ y: window.scrollY }); if (this.checkHover) this.checkHover(); };\n    window.addEventListener('mousemove', this.onMouse, { passive: true });\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    this.onScroll();\n    if (this.mountExtra) this.mountExtra();\n  }\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this.onScroll);\n    window.removeEventListener('mousemove', this.onMouse);\n    if (this.unmountExtra) this.unmountExtra();\n  }\n  headerVals() {\n    const y = this.state.y;\n    const fadeEnd = Math.max(200, (typeof window !== 'undefined' ? window.innerHeight : 800) * 0.6);\n    const cue = Math.max(0, 1 - y / 200);\n    return { theme: this.props.theme ?? 'auto', headerBg: Math.round(Math.min(1, y / fadeEnd) * 100), cueOpacity: cue, cueY: (1 - cue) * 16 + 'px', cuePE: cue > 0.1 ? 'auto' : 'none' };\n  }\n  bindSegVideos() {\n    if (!this.state.open) return;\n    document.querySelectorAll('video[data-seg]').forEach(el => {\n      if (el.__seg) return;\n      let fresh = false;\n      if (!el.getAttribute('src') && el.dataset.src) { el.preload = 'auto'; el.src = el.dataset.src; fresh = true; }\n      const [a, b] = el.getAttribute('data-seg').split(',').map(Number);\n      el.__seg = true;\n      el.muted = true; el.defaultMuted = true; el.loop = false; el.playsInline = true;\n      const start = () => { try { el.currentTime = a; } catch (e) {} el.play().catch(() => {}); };\n      el.addEventListener('loadedmetadata', start);\n      el.addEventListener('timeupdate', () => { if (el.currentTime >= b || el.currentTime < a - 0.5) { el.currentTime = a; el.play().catch(() => {}); } });\n      el.addEventListener('ended', start);\n      if (fresh) el.load();\n      if (el.readyState >= 1) start(); else el.play().catch(() => {});\n    });\n  }\n  componentDidUpdate() { this.bindSegVideos(); }\n  mountExtra() {\n    this.bindSegVideos();\n    this.onHash = () => this.syncHash(true);\n    this.onKey = e => {\n      if (e.key !== 'Escape') return;\n      if (this.state.vid) this.setState({ vid: 0 });\n      else if (this.state.lb) this.setState({ lb: false });\n      else if (this.state.open) this.closeCase();\n    };\n    window.addEventListener('hashchange', this.onHash);\n    window.addEventListener('keydown', this.onKey);\n    this.syncHash(false);\n  }\n  unmountExtra() {\n    window.removeEventListener('hashchange', this.onHash);\n    window.removeEventListener('keydown', this.onKey);\n    document.documentElement.style.overflow = '';\n  }\n  syncHash(fromNav) {\n    const i = this.keys.indexOf(location.hash.slice(1));\n    if (i >= 0 && this.ready.includes(i)) {\n      if (fromNav && !this.state.open) this.openedHere = true;\n      document.documentElement.style.overflow = 'hidden';\n      this.setState({ open: true, shown: i, hover: -1, navShown: false, part: null }, () => {\n        const s = this.sheetRef.current;\n        if (s) { s.scrollTop = 0; s.focus({ preventScroll: true }); }\n      });\n    } else if (this.state.open) {\n      document.documentElement.style.overflow = '';\n      this.setState({ open: false });\n      const card = document.querySelector('[data-row=\"' + this.state.shown + '\"]');\n      if (card) card.focus({ preventScroll: true });\n    }\n  }\n  closeCase() {\n    if (this.openedHere) { this.openedHere = false; history.back(); }\n    else { history.replaceState(null, '', location.pathname + location.search); this.syncHash(false); }\n  }\n  goTo(i) { history.replaceState(null, '', '#' + this.keys[i]); this.syncHash(false); }\n  jump(key, part) {\n    const s = this.sheetRef.current, el = s && s.querySelector('#ov-' + key + '-' + part);\n    if (!el) return;\n    const chips = s.querySelector('[data-chips]');\n    const off = (this.barRef.current ? this.barRef.current.offsetHeight : 66) + (chips ? chips.offsetHeight : 64) + 20;\n    s.scrollTo({ top: el.getBoundingClientRect().top - s.getBoundingClientRect().top + s.scrollTop - off, behavior: 'smooth' });\n  }\n  sheetScroll() {\n    const s = this.sheetRef.current; if (!s) return;\n    const bar = this.barRef.current, barH = bar ? bar.offsetHeight : 66;\n    const top = s.getBoundingClientRect().top + barH;\n    const chips = s.querySelector('[data-chips]');\n    const navShown = !!chips && chips.getBoundingClientRect().top <= top + 1 && s.scrollTop > 0;\n    if (barH !== this.state.barH) this.setState({ barH });\n    const key = this.keys[this.state.shown];\n    let part = null;\n    ['problem', 'iteration', 'result'].forEach(p => { const el = s.querySelector('#ov-' + key + '-' + p); if (el && el.getBoundingClientRect().top < top + 180) part = p; });\n    if (navShown !== this.state.navShown || part !== this.state.part) this.setState({ navShown, part });\n  }\n  checkHover() {\n    if (this.mx == null || this.state.open) return;\n    const el = document.elementFromPoint(this.mx, this.my);\n    const row = el && el.closest ? el.closest('[data-row]') : null;\n    const h = row ? Number(row.getAttribute('data-row')) : -1;\n    if (h !== this.state.hover) this.setState({ hover: h });\n  }\n  renderVals() {\n    const h = this.state.hover, open = this.state.open, shown = this.state.shown;\n    const row = i => {\n      const on = h === i, p = this.projects[i];\n      return {\n        shadow: on ? 'inset 0 0 0 3px ' + p.c + ', 0 8px 0 color-mix(in oklch, ' + p.c + ' 70%, black)' : '0 4px 0 var(--edge)',\n        lift: on ? '-4px' : '0px',\n        tilt: (on ? p.hoverTilt : p.tilt) + 'deg',\n        chip: on ? p.c : 'var(--panel-2)',\n        chipInk: on ? 'oklch(0.22 0.03 50)' : 'var(--ink)',\n        chipShadow: on ? '0 4px 0 color-mix(in oklch, ' + p.c + ' 65%, black)' : '0 4px 0 var(--edge)',\n        arrow: on ? '4px' : '0px',\n        frame: on ? p.c : 'var(--gold)',\n      };\n    };\n    const v = {\n      ...this.headerVals(),\n      palette: this.props.palette ?? 'Midnight',\n      accent: this.props.accent ?? 'Silver',\n      h0: row(0), h1: row(1), h2: row(2), h3: row(3),\n      onLeave: () => this.setState({ hover: -1 }),\n      sheetRef: this.sheetRef,\n      closeCase: () => this.closeCase(),\n      ovHidden: open ? 'false' : 'true', ovPE: open ? 'auto' : 'none', ovVis: open ? 'visible' : 'hidden', ovVisDelay: open ? '0s' : '.5s',\n      ovOpacity: open ? 1 : 0, ovY: open ? '0%' : '105%',\n      ovTitle: this.titles[shown], ovColor: this.projects[shown].c,\n      sheetScroll: () => this.sheetScroll(),\n      barRef: this.barRef,\n      vidOpen: !!this.state.vid,\n      vidSrc: this.state.vid ? 'https://www.youtube-nocookie.com/embed/' + this.videos[this.state.vid] + '?autoplay=1&rel=0' : '',\n      vidTitle: this.state.vid ? this.titles[this.state.vid] : '',\n      closeVid: () => this.setState({ vid: 0 }),\n      vid1: () => this.setState({ vid: 1 }), vid2: () => this.setState({ vid: 2 }), vid3: () => this.setState({ vid: 3 }),\n      vidKey1: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.setState({ vid: 1 }); } },\n      vidKey2: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.setState({ vid: 2 }); } },\n      vidKey3: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.setState({ vid: 3 }); } },\n      gem: React.createElement('span', {\n        'data-gem': '', 'aria-label': '.',\n        style: {\n          '--gem': ({ Emerald: 'oklch(0.8 0.17 160)', Violet: 'oklch(0.72 0.2 300)', Teal: 'oklch(0.8 0.13 190)', Fel: 'oklch(0.86 0.22 135)', Frost: 'oklch(0.86 0.1 220)', Ember: 'oklch(0.74 0.19 45)' })[this.props.gem ?? 'Frost'] || 'oklch(0.86 0.1 220)',\n          display: 'inline-block', width: '0.36em', height: '0.36em', borderRadius: '0.06em', transform: 'rotate(45deg)',\n          background: 'var(--gem)', animation: 'gemPulse 3.2s ease-in-out infinite',\n        },\n      }),\n      lbOpen: !!this.state.lb,\n      openSpec: () => this.setState({ lb: true }),\n      closeSpec: () => this.setState({ lb: false }),\n      barH: this.state.barH || 66,\n      barShadow: '0 4px 0 var(--edge)',\n      chipsBg: 'transparent',\n      chipsShadow: 'none',\n    };\n    this.keys.forEach((k, i) => ['problem', 'iteration', 'result'].forEach(p => {\n      v['cb_' + k + '_' + p] = shown === i && this.state.part === p\n        ? 'color-mix(in oklch, ' + this.projects[i].c + ' 30%, var(--panel-2))'\n        : 'var(--panel)';\n    }));\n    this.keys.forEach((k, i) => {\n      v['enter' + i] = () => this.setState({ hover: i });\n      v['show' + i] = shown === i;\n      v['next' + i] = () => this.goTo((i + 1) % this.keys.length);\n      ['problem', 'iteration', 'result'].forEach(part => { v['jump_' + k + '_' + part] = () => this.jump(k, part); });\n    });\n    return v;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
